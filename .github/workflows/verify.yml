name: Science, learning and hosted mathematics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thermometry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install scientific and capture runtimes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install -r verification/requirements.txt
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/thermometry-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/thermometry-evidence/revision.txt"
          .venv/bin/pip freeze > "$RUNNER_TEMP/thermometry-evidence/dependencies.txt"
      - name: Probe representative hosted mathematics
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/probe_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$TARGET_SHA" --page science/model.md \
            --output "$RUNNER_TEMP/thermometry-evidence/probe"
      - name: Run scientific reproduction and learning checks
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python verification/checks.py | tee "$RUNNER_TEMP/thermometry-evidence/science.txt"
          .venv/bin/python verification/learning_checks.py | tee "$RUNNER_TEMP/thermometry-evidence/learning.txt"
      - name: Compare every hosted expression at both widths
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          node verification/hosted_math/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$TARGET_SHA" \
            --output "$RUNNER_TEMP/thermometry-evidence/hosted"
      - name: Retain actual captures and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thermometry-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/thermometry-evidence
          retention-days: 14
          if-no-files-found: error
